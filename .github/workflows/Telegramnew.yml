name: Telegram Media to Release

on:
  workflow_dispatch:
    inputs:
      telegram_link:
        description: "🔗 Public Telegram post link(s), comma-separated (e.g., https://t.me/channel/123,https://t.me/channel/124)"
        required: true
        type: string
      release_tag:
        description: "🏷️ GitHub Release tag (e.g., v1.0.0 or telegram-2026-07-12)"
        required: true
        type: string
      release_title:
        description: "📋 Release title (optional)"
        required: false
        type: string
        default: "Telegram Media Download"
      release_notes:
        description: "📝 Release notes (optional)"
        required: false
        type: string
        default: "Media downloaded from Telegram via GitHub Actions."

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: 📥 Download media from Telegram
        id: telegram_download
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_LINK: ${{ github.event.inputs.telegram_link }}
        run: |
          mkdir -p downloaded_media
          python scripts/download_telegram_media.py

      - name: 🔍 Inspect downloaded files
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "📂 Inspecting downloaded_media directory"
          echo "═══════════════════════════════════════════════════════════════"
          ls -lah downloaded_media/ || true
          if [ -f "downloaded_media/downloaded_files.txt" ]; then
            echo "📄 Manifest content:"
            cat downloaded_media/downloaded_files.txt
          else
            echo "⚠️ No manifest file found"
          fi

      - name: 🏷️ Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
          TITLE: ${{ github.event.inputs.release_title }}
          NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Will upload assets to it."
          else
            echo "Creating release $TAG ..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

      - name: ⬆️ Upload downloaded media to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          MANIFEST="downloaded_media/downloaded_files.txt"

          if [ ! -f "$MANIFEST" ]; then
            echo "❌ No downloaded media manifest found. Nothing to upload."
            exit 1
          fi

          echo "═══════════════════════════════════════════════════════════════"
          echo "📤 Uploading files to release: $TAG"
          echo "═══════════════════════════════════════════════════════════════"

          UPLOAD_FAILED=0
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "⬆️ Uploading $(basename "$file") ($(stat -c%s "$file" | numfmt --to=iec-i)) ..."
              if ! gh release upload "$TAG" "$file" --clobber; then
                echo "   ❌ Failed to upload $(basename "$file")"
                UPLOAD_FAILED=1
              else
                echo "   ✅ Uploaded $(basename "$file")"
              fi
            else
              echo "⚠️ Skipping invalid path: $file"
            fi
          done < "$MANIFEST"

          if [ "$UPLOAD_FAILED" -eq 1 ]; then
            echo "❌ One or more uploads failed."
            exit 1
          fi

          echo "✅ All files uploaded successfully."
