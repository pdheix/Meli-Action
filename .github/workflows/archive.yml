name: Telegram News Archiver

# ─────────────────────────────────────────────────────────────
#  هر ۵ دقیقه یک‌بار اجرا می‌شود + امکان اجرای دستی از تب Actions
#  در هر اجرا:
#   - فایل‌های JSON و رسانه‌ی قبلی پاک می‌شوند
#   - پیام‌های اخیر از همه‌ی کانال‌ها دریافت می‌شود
#   - یک فایل JSON واحد با نام archive.json ساخته می‌شود
#   - لینک رسانه‌ها به raw.githubusercontent.com اشاره می‌کند
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes (GitHub time is UTC)
  workflow_dispatch:           # manual run button

permissions:
  contents: write              # برای commit و push لازم است

concurrency:
  group: telegram-archiver
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram archiver
        env:
          # ── اسرار تلگرام (از GitHub Secrets) ──
          TELEGRAM_API_ID:                 ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:               ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:                ${{ secrets.TELEGRAM_SESSION_STRING }}

          # ── مسیر و تنظیمات خروجی ──
          OUTPUT_FILE:                     "archive.json"           # یک فایل JSON واحد
          MESSAGES_PER_CHANNEL:            "30"                     # پیام اخیر از هر کانال
          MAX_MEDIA_MB:                    "99"                     # حداکثر حجم دانلود (مگابایت)
          MAX_MEDIA_DOWNLOADS_PER_RUN:     "50"                     # حداکثر تعداد رسانه در هر اجرا
          RUN_TIME_BUDGET_SEC:             "480"                    # بودجه‌ی زمانی دانلود (ثانیه)

          # ── لینک raw گیت‌هاب (اختیاری) ──
          # اگر خالی بگذارید، خودکار از GITHUB_REPOSITORY و GITHUB_REF_NAME ساخته می‌شود:
          #   https://raw.githubusercontent.com/<owner>/<repo>/<branch>/...
          # اگر از برانچ دیگری سرو می‌کنید یا از CDN استفاده می‌کنید، اینجا تنظیم کنید:
          RAW_BASE_URL:                    ""

        run: python archive.py

      - name: Commit and push changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # فایل‌های پاک‌شده را هم برای ثبت به git اضافه کن
          git add -A
          if git diff --cached --quiet; then
            echo "✅ تغییر جدیدی برای commit وجود ندارد."
          else
            git commit -m "📥 Refresh Telegram archive — $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M Tehran')"
            git push
            echo "✅ تغییرات با موفقیت push شدند."
          fi
