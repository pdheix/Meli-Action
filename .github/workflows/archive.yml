name: Telegram News Archiver

# ─────────────────────────────────────────────────────────────
#  هر ۵ دقیقه یک‌بار اجرا می‌شود + امکان اجرای دستی از تب Actions
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes (GitHub time is UTC)
  workflow_dispatch:           # manual run button

permissions:
  contents: write              # برای commit و push لازم است

# جلوگیری از اجرای هم‌زمان دو نسخه از ورک‌فلو
concurrency:
  group: telegram-archiver
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # کمی حاشیه‌ی امن؛ اسکریپت خودش بودجه‌ی زمانی ۸ دقیقه‌ای برای دانلود دارد

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram archiver
        env:
          TELEGRAM_API_ID:                 ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:               ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:                ${{ secrets.TELEGRAM_SESSION_STRING }}
          BATCH_SIZE:                      "20"   # تعداد پیام در هر فایل JSON
          MAX_MEDIA_MB:                    "99"   # حداکثر حجم دانلود (مگابایت) — زیر ۱۰۰
          MESSAGES_PER_CHANNEL:            "100"  # سقف پیام جدید برای هر کانال در اجراهای عادی
          FIRST_RUN_MESSAGES:              "15"   # سقف بک‌فیل پیام در اولین اجرای هر کانال
          MAX_MEDIA_DOWNLOADS_PER_RUN:     "40"   # حداکثر تعداد فایل دانلودشده در هر اجرا
          RUN_TIME_BUDGET_SEC:             "480"  # بودجه‌ی زمانی کل دانلود (ثانیه) — ۸ دقیقه
        run: python archive.py

      - name: Commit and push changes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "✅ تغییر جدیدی برای commit وجود ندارد."
          else
            git commit -m "📥 Archive Telegram messages — $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M Tehran')"
            git push
            echo "✅ تغییرات با موفقیت push شدند."
          fi
